[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "lazproof-geo"
version = "0.1.0"
description = "Prove that a LAS/LAZ file is an exact, order-preserving spatial subset of another"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{name = "Alena Nikitina"}]
keywords = ["lidar", "las", "laz", "point-cloud", "verification", "gis"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
  "laspy[lazrs]>=2.5,<3",
  "numpy>=1.26",
  "shapely>=2.0,<3",
  "fiona>=1.9,<2",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
lazproof = "lazproof.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
